<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown Raffle</title>
<meta name="description" content="Create a raffle, share the link, and the wheel spins when the countdown hits zero.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Countdown Raffle">
<meta property="og:title" content="🎡 You're invited to a raffle!">
<meta property="og:description" content="Open the link to see the countdown. The wheel spins live at the draw time.">
<meta property="og:image" content="https://wuenschtim99.github.io/raffle_generator/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#0f1220; --card:#181c30; --line:#2a3050; --text:#eef0fa; --muted:#9aa1c3;
    --accent:#ffcc33; --accent-ink:#1a1400; --ok:#4ade80; --danger:#f87171;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
  h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
  label{display:block;font-weight:600;margin:16px 0 6px}
  label:first-child{margin-top:0}
  .hint{font-weight:400;color:var(--muted);font-size:.85rem}
  input,textarea{width:100%;background:#0b0e1a;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font:inherit}
  textarea{min-height:180px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row > *{flex:1 1 140px}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  button.wa{background:#25d366;color:#05250f}
  button:disabled{opacity:.5;cursor:not-allowed}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .quick button{padding:6px 10px;font-size:.85rem;font-weight:600}
  .err{color:var(--danger);min-height:1.5em;margin:10px 0 0}
  .share{margin-top:20px;display:none}
  .share.show{display:block}
  .linkbox{display:flex;gap:8px;margin-top:8px}
  .linkbox input{flex:1;font-family:ui-monospace,monospace;font-size:.85rem}
  .count{color:var(--muted);font-size:.85rem;margin-top:4px}

  /* Raffle view */
  .center{text-align:center}
  .timer{display:flex;justify-content:center;gap:10px;margin:18px 0 8px}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:70px;padding:10px 6px}
  .unit b{display:block;font-size:clamp(1.6rem,7vw,2.6rem);font-variant-numeric:tabular-nums;line-height:1.1}
  .unit span{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
  .when{color:var(--muted);margin:0 0 20px}
  .wheel-wrap{position:relative;width:min(100%,460px);margin:0 auto;aspect-ratio:1}
  canvas{width:100%;height:100%;display:block}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--accent);filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));z-index:2}
  .status{font-size:1.1rem;margin:18px 0 0;min-height:1.6em;color:var(--muted)}
  .winner{display:none;margin-top:18px;padding:20px;border-radius:16px;background:linear-gradient(135deg,#ffcc33,#ff8a3d);color:#1a1000}
  .winner.show{display:block;animation:pop .5s ease-out}
  .winner small{display:block;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.75rem}
  .winner strong{display:block;font-size:clamp(1.8rem,7vw,2.8rem);line-height:1.15;word-break:break-word}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .people{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:24px}
  .people span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem}
  .people span.won{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
  .actions{margin-top:24px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .actions button{flex:0 1 auto}
  a{color:var(--accent)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
  [hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<main>

  <!-- CREATE VIEW -->
  <section id="create" hidden>
    <h1>🎡 Countdown Raffle</h1>
    <p class="sub">Add the names, pick a draw time, and share the link. When the countdown ends, the wheel spins for everyone at the same moment.</p>
    <div class="card">
      <label for="title">Raffle title</label>
      <input id="title" maxlength="80" placeholder="e.g. Friday Pizza Raffle">

      <label for="names">Participants <span class="hint">— one per line (or separated by commas)</span></label>
      <textarea id="names" placeholder="Alice&#10;Bob&#10;Charlie"></textarea>
      <div class="count" id="nameCount">0 participants</div>

      <label for="when">Draw time</label>
      <input id="when" type="datetime-local">
      <div class="quick">
        <button class="ghost" data-min="1">+1 min</button>
        <button class="ghost" data-min="5">+5 min</button>
        <button class="ghost" data-min="30">+30 min</button>
        <button class="ghost" data-min="60">+1 hour</button>
        <button class="ghost" data-min="1440">+1 day</button>
      </div>

      <p class="err" id="err"></p>
      <button id="go" style="width:100%">Create raffle link</button>

      <div class="share" id="share">
        <label>Invite link <span class="hint">— send this to all participants</span></label>
        <div class="linkbox">
          <input id="link" readonly>
          <button id="copy">Copy</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="wa" id="wa">Share on WhatsApp</button>
          <button class="ghost" id="copyMsg">Copy invite message</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="ghost" id="open">Open raffle</button>
          <button class="ghost" id="nativeShare" hidden>Share…</button>
        </div>
      </div>
    </div>
  </section>

  <!-- RAFFLE VIEW -->
  <section id="raffle" class="center" hidden>
    <h1 id="rTitle"></h1>
    <div class="timer" id="timer">
      <div class="unit"><b id="d">0</b><span>days</span></div>
      <div class="unit"><b id="h">00</b><span>hrs</span></div>
      <div class="unit"><b id="m">00</b><span>min</span></div>
      <div class="unit"><b id="s">00</b><span>sec</span></div>
    </div>
    <p class="when" id="rWhen"></p>
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="920" height="920"></canvas>
    </div>
    <p class="status" id="status"></p>
    <div class="winner" id="winner"><small>Winner</small><strong id="winnerName"></strong></div>
    <div class="people" id="people"></div>
    <div class="actions">
      <button class="wa" id="wa2">Share on WhatsApp</button>
      <button class="ghost" id="copy2">Copy invite message</button>
      <button class="ghost" id="replay" hidden>Replay spin</button>
      <button class="ghost" id="newOne">Create your own raffle</button>
    </div>
  </section>

</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const SPIN_MS = 9000;
  const COLORS = ['#ff5d73','#ffb347','#ffe066','#7bd389','#4cc9f0','#7b8cff','#c77dff','#ff8fc7','#5eead4','#f9a8d4','#a3e635','#fb923c'];

  // ---------- encoding (raffle lives entirely in the URL) ----------
  const b64e = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const b64d = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); };

  function encodeRaffle(r){ return b64e(JSON.stringify({v:1,t:r.title,n:r.names,a:r.at,s:r.seed})); }
  function decodeRaffle(h){
    try {
      const o = JSON.parse(b64d(h));
      if (!Array.isArray(o.n) || o.n.length < 2 || typeof o.a !== 'number') return null;
      return {title:String(o.t||'Raffle'), names:o.n.map(String), at:o.a, seed:String(o.s||'')};
    } catch { return null; }
  }

  // Deterministic: everyone with the same link gets the same winner and the same spin.
  function hash32(str){ let h = 2166136261 >>> 0; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed){ let a = seed; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function fmtWhen(at){
    return new Date(at).toLocaleString(undefined, {weekday:'short', day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', timeZoneName:'short'});
  }
  function inviteText(title, at, count, url){
    return `🎡 *${title}*\n⏰ The wheel spins on *${fmtWhen(at)}*\n👥 ${count} participants\n\nWatch the draw live: ${url}`;
  }
  const openWhatsApp = text => window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');

  const route = () => {
    const h = location.hash.slice(1);
    if (h.startsWith('r=')) { const r = decodeRaffle(h.slice(2)); if (r) return showRaffle(r); }
    showCreate();
  };
  window.addEventListener('hashchange', () => location.reload());

  // ---------- CREATE ----------
  function parseNames(txt){
    const seen = new Set();
    return txt.split(/[\n,]+/).map(s => s.trim()).filter(s => s && !seen.has(s.toLowerCase()) && seen.add(s.toLowerCase()));
  }
  function toLocalInput(d){ const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }

  function showCreate(){
    $('create').hidden = false;
    document.title = 'Countdown Raffle';
    const def = new Date(Date.now() + 10*60000); def.setSeconds(0,0);
    $('when').value = toLocalInput(def);
    const upd = () => { const n = parseNames($('names').value).length; $('nameCount').textContent = n + (n===1?' participant':' participants'); };
    $('names').addEventListener('input', upd);
    document.querySelectorAll('[data-min]').forEach(b => b.onclick = () => {
      const d = new Date(Date.now() + (+b.dataset.min)*60000); d.setSeconds(0,0);
      if (+b.dataset.min === 1) d.setMinutes(d.getMinutes()+1);
      $('when').value = toLocalInput(d);
    });
    $('go').onclick = () => {
      const names = parseNames($('names').value);
      const at = new Date($('when').value).getTime();
      $('err').textContent = '';
      if (names.length < 2) return $('err').textContent = 'Add at least 2 participants.';
      if (!at || isNaN(at)) return $('err').textContent = 'Pick a draw time.';
      if (at < Date.now() + 5000) return $('err').textContent = 'The draw time must be in the future.';
      const seed = Array.from(crypto.getRandomValues(new Uint32Array(2)), x => x.toString(36)).join('');
      const url = location.href.split('#')[0] + '#r=' + encodeRaffle({title: $('title').value.trim() || 'Raffle', names, at, seed});
      $('link').value = url;
      $('share').classList.add('show');
      const title = $('title').value.trim() || 'Raffle';
      const msg = inviteText(title, at, names.length, url);
      $('open').onclick = () => { location.href = url; };
      $('wa').onclick = () => openWhatsApp(msg);
      $('copyMsg').onclick = () => copy(msg, $('copyMsg'));
      if (navigator.share) { $('nativeShare').hidden = false; $('nativeShare').onclick = () => navigator.share({title, text: msg}).catch(()=>{}); }
      $('share').scrollIntoView({behavior:'smooth', block:'center'});
    };
    $('copy').onclick = () => copy($('link').value, $('copy'));
  }

  function copy(text, btn){
    const done = () => { const o = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = o, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    function fallback(){ const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
  }

  // ---------- RAFFLE ----------
  function showRaffle(r){
    $('raffle').hidden = false;
    $('rTitle').textContent = r.title;
    document.title = r.title + ' · Raffle';
    $('rWhen').textContent = 'Draw: ' + fmtWhen(r.at);
    $('people').innerHTML = '';
    r.names.forEach(n => { const s = document.createElement('span'); s.textContent = n; $('people').appendChild(s); });
    const msg = inviteText(r.title, r.at, r.names.length, location.href);
    $('copy2').onclick = () => copy(msg, $('copy2'));
    $('wa2').onclick = () => openWhatsApp(msg);
    $('newOne').onclick = () => { location.href = location.href.split('#')[0]; };

    const n = r.names.length;
    const rand = rng(hash32(r.seed + '|' + r.at + '|' + r.names.join('\u0001')));
    const winnerIdx = Math.floor(rand() * n);
    const seg = 2*Math.PI / n;
    // Land somewhere inside the winner's slice (not on the edge), after several full turns.
    const offsetInSlice = (0.15 + rand()*0.7) * seg;
    const turns = 7 + Math.floor(rand()*3);
    // Pointer is at top (-90deg). Slice i spans [i*seg, (i+1)*seg] from rotation 0 at angle -90.
    const finalRot = turns*2*Math.PI + (2*Math.PI - (winnerIdx*seg + offsetInSlice));

    const cv = $('wheel'), ctx = cv.getContext('2d');
    function draw(rot){
      const W = cv.width, c = W/2, R = c - 10;
      ctx.clearRect(0,0,W,W);
      ctx.save(); ctx.translate(c,c); ctx.rotate(rot - Math.PI/2);
      for (let i=0;i<n;i++){
        ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,i*seg,(i+1)*seg); ctx.closePath();
        ctx.fillStyle = COLORS[(n % COLORS.length === 1 && i === n-1) ? 1 : i % COLORS.length]; ctx.fill();
        ctx.strokeStyle = 'rgba(15,18,32,.6)'; ctx.lineWidth = 3; ctx.stroke();
        ctx.save(); ctx.rotate(i*seg + seg/2);
        ctx.fillStyle = '#141414'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        const fs = Math.max(14, Math.min(40, (R*seg)*0.55, 520/Math.max(6, n)));
        ctx.font = `700 ${fs}px system-ui,sans-serif`;
        let label = r.names[i]; const maxW = R*0.72;
        while (ctx.measureText(label).width > maxW && label.length > 2) label = label.slice(0,-2) + '…';
        ctx.fillText(label, R - 22, 0);
        ctx.restore();
      }
      ctx.restore();
      ctx.beginPath(); ctx.arc(c,c,R,0,2*Math.PI); ctx.lineWidth = 10; ctx.strokeStyle = '#ffcc33'; ctx.stroke();
      ctx.beginPath(); ctx.arc(c,c,R*0.12,0,2*Math.PI); ctx.fillStyle = '#0f1220'; ctx.fill(); ctx.lineWidth = 6; ctx.stroke();
    }
    const ease = t => 1 - Math.pow(1 - t, 4);

    let shown = false, replayStart = null;
    function reveal(){
      if (shown) return; shown = true;
      $('winnerName').textContent = r.names[winnerIdx];
      $('winner').classList.add('show');
      $('status').textContent = '🎉 We have a winner!';
      $('people').children[winnerIdx].classList.add('won');
      $('replay').hidden = false;
      confetti();
    }
    $('replay').onclick = () => { replayStart = performance.now(); $('status').textContent = 'Spinning…'; };

    function setTimer(ms){
      ms = Math.max(0, ms); const t = Math.ceil(ms/1000);
      const d = Math.floor(t/86400), h = Math.floor(t%86400/3600), m = Math.floor(t%3600/60), s = t%60;
      $('d').textContent = d; $('h').textContent = String(h).padStart(2,'0'); $('m').textContent = String(m).padStart(2,'0'); $('s').textContent = String(s).padStart(2,'0');
      $('d').parentElement.hidden = d === 0;
    }

    let idle = 0;
    function frame(){
      const now = Date.now(), left = r.at - now;
      if (replayStart !== null){
        const p = Math.min(1, (performance.now() - replayStart) / SPIN_MS);
        draw(ease(p)*finalRot);
        if (p >= 1){ replayStart = null; $('status').textContent = '🎉 We have a winner!'; }
      } else if (left > 0){
        setTimer(left);
        idle += 0.002; draw(idle);  // gentle idle rotation while waiting
        $('status').textContent = left < 10000 ? 'Get ready…' : 'Waiting for the draw…';
      } else {
        setTimer(0);
        const p = Math.min(1, -left / SPIN_MS);   // synced across devices by the clock
        draw(ease(p)*finalRot);
        if (p < 1) $('status').textContent = 'Spinning…'; else reveal();
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  // ---------- confetti ----------
  function confetti(){
    const c = $('confetti'), x = c.getContext('2d');
    const fit = () => { c.width = innerWidth; c.height = innerHeight; }; fit(); addEventListener('resize', fit);
    const ps = Array.from({length:180}, () => ({x:Math.random()*c.width, y:-20-Math.random()*c.height*0.5, vx:(Math.random()-.5)*4, vy:2+Math.random()*4, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, w:6+Math.random()*6, col:COLORS[Math.random()*COLORS.length|0]}));
    const start = performance.now();
    (function tick(){
      x.clearRect(0,0,c.width,c.height);
      ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .04; p.r += p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.col; x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2); x.restore(); });
      if (performance.now() - start < 6000) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height);
    })();
  }

  route();
})();
</script>
</body>
</html>
